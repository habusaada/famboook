<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#751BD5">
  <meta name="robots" content="noindex">
  <title>فامبوك — لا يوجد اتصال</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: #F7F7FA;
      color: #1B1B23;
      font-family: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    }
    main {
      width: 100%;
      max-width: 400px;
      padding: 28px 24px;
      border: 1px solid #E6E6EE;
      border-radius: 16px;
      background: #FFFFFF;
      text-align: center;
    }
    .brand { margin: 0 0 20px; font-size: 15px; font-weight: 700; color: #751BD5; }
    h1 { margin: 0 0 8px; font-size: 20px; line-height: 1.4; }
    p { margin: 0 0 24px; font-size: 15px; line-height: 1.7; color: #55556A; }
    button {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 12px;
      background: #751BD5;
      color: #FFFFFF;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #651CAD; }
    button:focus-visible { outline: 2px solid #42047E; outline-offset: 2px; }
  </style>
</head>
<body>
  <!-- Static on purpose: no family data, no account, no script beyond the retry. -->
  <main>
    <p class="brand">فامبوك</p>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>تحقق من اتصالك بالإنترنت ثم حاول مرة أخرى.</p>
    <button type="button" onclick="location.reload()">إعادة المحاولة</button>
  </main>
</body>
</html>
