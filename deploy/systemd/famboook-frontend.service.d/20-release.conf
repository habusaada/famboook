# Famboook Next.js — active release selection (FB-DEVOPS-01). TEMPLATE, not installed.
# Install only in an approved migration (docs/deployment/FB-DEVOPS-01-ISOLATED-FRONTEND-BUILDS.md,
# §7) as /etc/systemd/system/famboook-frontend.service.d/20-release.conf, then
# `systemctl daemon-reload`. deploy/scripts/switch-frontend-release.sh writes the file.
# This does not by itself prove that the file decides the release: an ExecStart wrapper or
# a later EnvironmentFile= can win. Follow the runbook's checks; the switch script compares
# the running process with the file and refuses on a mismatch.
[Service]
EnvironmentFile=/etc/famboook/frontend-release.env
